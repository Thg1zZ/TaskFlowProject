name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testes unitários + integração (Testcontainers usa o Docker do runner)
      - run: mvn -B verify

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: taskmanager
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_URL: http://localhost:8080/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/taskmanager
          DB_USER: postgres
          DB_PASSWORD: e2e
          COOKIE_SECURE: 'false'
          FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
        run: |
          mvn -B -q package -DskipTests
          JWT_SECRET="$(openssl rand -base64 48)" nohup java -jar target/task-manager-1.0.0.jar > backend.log 2>&1 &
          curl -sf --retry 60 --retry-connrefused --retry-delay 2 http://localhost:8080/actuator/health

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/backend.log
          retention-days: 7
